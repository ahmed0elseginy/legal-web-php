services:
  db:
    image: mysql:8.0
    container_name: mizan_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: singup_task
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - mizan-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    container_name: mizan_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: rootpassword
      DB_NAME: singup_task
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mizan-net
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mizan_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - mizan-net
    restart: unless-stopped

volumes:
  db_data:

networks:
  mizan-net:
    driver: bridge
